<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디저트런 공식 홈페이지</title><style>body{margin:0;font-family:system-ui;background:#fff1d9;color:#613923;text-align:center}header{background:#ffbd78;padding:30px}h1{font-size:42px}button,input{font:inherit;border:2px solid #e7a36b;border-radius:12px;padding:10px;background:white;color:#683a24;cursor:pointer}nav{padding:15px}main{max-width:1000px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:white;border-radius:16px;padding:10px;border:2px solid #efc89c}.face{font-size:65px}.detail{position:fixed;inset:0;background:#3325;display:grid;place-items:center}.panel{background:#fffaf0;border-radius:20px;padding:25px;width:min(350px,85vw)}.hide{display:none}.pages{padding:20px}button:focus{outline:3px solid orange}</style><header><h1>🍰 디저트런 🍪</h1><p>디저트 왕국 공식 홈페이지 · 베타</p></header><nav><button onclick="show('home')">🏠 홈</button> <button onclick="show('dex')">📖 도감</button> <button onclick="show('game')">🎮 게임</button></nav><main><section id="home"><h2>달콤한 모험에 오신 걸 환영해요!</h2><p>300종 디저트 친구를 만나보세요.</p><button onclick="show('dex')">도감 열기 →</button></section><section id="dex" class="hide"><h2>🍪 디저트 도감 300종</h2><p id="counter"></p><input id="search" placeholder="캐릭터 검색" oninput="draw(1)"><div id="grid" class="grid"></div><div id="pages" class="pages"></div></section><section id="game" class="hide"><h2>🎮 달콤한 쿠키마을 1-1</h2><p>🍪 바삭쿠키와 함께 달리고 젤리를 모아봐!</p><div style="margin:12px auto;padding:12px;background:#fff;border-radius:16px;max-width:690px"><strong>👑 캐릭터 선택</strong><div id="characterPicker" style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:9px"></div><p id="chosenCharacter" style="margin:8px">현재 캐릭터: 🍪 바삭쿠키</p></div><div id="scoreboard">점수 0 · 체력 100 · 최고 0</div><canvas id="runner" width="720" height="340" style="width:100%;max-width:720px;background:#bceeff;border:5px solid #e7a36b;border-radius:18px;touch-action:none"></canvas><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px"><button onclick="startGame()">▶️ 시작 / 다시하기</button><button onpointerdown="jump()" style="background:#ffe0a8">⬆️ 점프</button><button onpointerdown="slide(true)" onpointerup="slide(false)" onpointercancel="slide(false)" onpointerleave="slide(false)" style="background:#ffe0a8">⬇️ 슬라이드</button><button onclick="togglePause()">⏸️ 일시정지</button><button id="skillButton" onclick="useSkill()" style="background:#e6d3ff">✨ 스킬 사용</button></div><p>아이패드: 점프 버튼 또는 게임 화면 터치 · 키보드: 스페이스 점프, ↓ 슬라이드</p><p id="gameMessage">시작 버튼을 눌러 모험을 시작해! · 사탕 자동 수집 v3 · 공중 바위 슬라이드 수정 v4</p></section></main><div id="detail" class="detail hide"><div class="panel"><button onclick="closeDetail()">✕ 닫기</button><div id="info"></div></div></div><script>const cats=['쿠키','젤리','도넛','푸딩','아이스크림','케이크','초콜릿','마카롱','떡','디저트'],icons=['🍪','🍓','🍩','🍮','🍦','🍰','🍫','🧁','🍡','🥐'],flavors=['바삭','딸기','초코칩','바닐라','꿀','민트','블루베리','레몬','카라멜','체리','우유','코코넛','복숭아','망고','라즈베리','솜사탕','호두','아몬드','황금','무지개','별빛','달빛','하트','구름','눈꽃','호박','시나몬','말차','크림','왕관'];const names=['바삭쿠키','딸기젤리','초코도넛','푸딩','바닐라크림','바닐라 아이스크림'];const all=Array.from({length:300},(_,i)=>({id:i+1,name:names[i]||flavors[i%30]+cats[Math.floor(i/30)],icon:icons[Math.floor(i/30)],hp:100+i%12*10}));function portrait(id){const c=all[id-1],k=id<=6?[0,1,2,3,4,4][id-1]:Math.floor((id-1)/30);const shapes=['🍪','🍓','🍩','🍮','🍦','🍰','🍫','🧁','🍡','🥐'];return '<span style="display:inline-flex;align-items:center;justify-content:center;width:75px;height:75px;border-radius:'+(k===2?'50%':'35%')+';background:'+(['#dba267','#fa9bbb','#bd8058','#f9d88c','#c5e9ff','#ffbdd0','#9e6c51','#f7b8dc','#f6d5e0','#ebc68a'][k]||'#f4c28b')+';border:4px solid #a36d4e;box-shadow:inset 0 -7px #0001;position:relative;font-size:28px">'+(k===2?'<span style="width:24px;height:24px;border-radius:50%;background:#fff1d9;border:3px solid #a36d4e"></span>':'<span style="position:absolute;top:14px">●  ●</span><span style="position:absolute;top:36px">ᴗ</span>')+'</span>'}let owned;try{owned=JSON.parse(localStorage.getItem('dessert-run-owned')||'[1]')}catch(e){owned=[1]}function show(id){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hide',s.id!==id));if(id==='dex')draw(1)}function draw(page){let q=document.getElementById('search').value;let a=all.filter(c=>c.name.includes(q));document.getElementById('counter').textContent='수집 '+owned.length+'/300 · 검색 결과 '+a.length+'종';document.getElementById('grid').innerHTML=a.slice((page-1)*30,page*30).map(c=>'<button class="card" onclick="openDetail('+c.id+')"><div class="face">'+c.icon+'</div><small>No.'+c.id+'</small><h4>'+c.name+'</h4><small>'+(owned.includes(c.id)?'✅ 수집':'🔒 미수집')+'</small></button>').join('');document.getElementById('pages').innerHTML=Array.from({length:Math.ceil(a.length/30)},(_,i)=>'<button onclick="draw('+(i+1)+')">'+(i+1)+'</button>').join('')}function openDetail(id){let c=all[id-1];document.getElementById('info').innerHTML='<div class="face">'+portrait(c.id)+'</div><h2>'+c.name+'</h2><p>❤️ 체력 '+c.hp+'</p><p>✨ 달콤한 마법</p><button onclick="claim('+id+')">'+(owned.includes(id)?'✓ 수집 완료':'🎁 VIP 무료 획득')+'</button><p><button style="background:#ffcf78;font-weight:bold" onclick="equipFromDex('+id+')">🎮 이 캐릭터 장착</button></p><small>장착하면 게임에서 이 캐릭터로 달릴 수 있어!</small>';document.getElementById('detail').classList.remove('hide')}function closeDetail(){document.getElementById('detail').classList.add('hide')}function claim(id){if(!owned.includes(id)){owned.push(id);localStorage.setItem('dessert-run-owned',JSON.stringify(owned))}openDetail(id);draw(1)}
const heroes=[{name:'바삭쿠키',icon:'🍪',color:'#cf8645',hp:120},{name:'딸기젤리',icon:'🍓',color:'#f45d86',hp:100},{name:'초코도넛',icon:'🍩',color:'#8d4d32',hp:160},{name:'푸딩',icon:'🍮',color:'#f4c04f',hp:140},{name:'바닐라크림',icon:'👑',color:'#f9e6aa',hp:180},{name:'바닐라 아이스크림',icon:'🍦',color:'#b6eafa',hp:250}];for(let i=6;i<all.length;i++){const c=all[i];heroes.push({name:c.name,icon:c.icon,color:['#e6a86a','#f486a7','#b67a50','#e5bb62','#a6dff3','#edb5d7','#9a5b43','#dd9fba','#e6cb9b','#d5a86b'][Math.floor(i/30)],hp:c.hp})}let selectedHero=0;function equipFromDex(id){if(!owned.includes(id)){owned.push(id);localStorage.setItem('dessert-run-owned',JSON.stringify(owned))}chooseHero(id-1);try{localStorage.setItem('dessert-run-equipped',String(id))}catch(e){}closeDetail();draw(1);show('game');document.getElementById('gameMessage').textContent='🎉 '+heroes[selectedHero].name+' 장착 완료! 시작 버튼을 눌러봐!'}function chooseHero(i){selectedHero=i;try{localStorage.setItem('dessert-run-equipped',String(i+1))}catch(e){}document.getElementById('chosenCharacter').textContent='현재 캐릭터: '+heroes[i].icon+' '+heroes[i].name+' ❤️ '+heroes[i].hp;document.querySelectorAll('#characterPicker button').forEach((b,j)=>{b.style.background=j===i?'#ffcf78':'white';b.style.borderWidth=j===i?'4px':'2px'});if(playing)startGame();else drawGame()}function initHeroes(){document.getElementById('characterPicker').innerHTML=heroes.slice(0,6).map((h,i)=>'<button onclick="chooseHero('+i+')">'+h.icon+' '+h.name+'</button>').join('')+'<button onclick="show(\'dex\')">📖 다른 캐릭터는 도감에서 장착</button>';let saved=Number(localStorage.getItem('dessert-run-equipped')||1);chooseHero(saved>=1&&saved<=heroes.length?saved-1:0)}
const cv=document.getElementById('runner'),ctx=cv.getContext('2d');let skillTime=0,skillCooldown=0,revived=false,playing=false,paused=false,raf=0,last=0,elapsed=0,score=0,hp=100,hi=Number(localStorage.getItem('dessert-run-best')||0),playerY=0,vy=0,sliding=false,items=[],spawn=0,invul=0;
function startGame(){cancelAnimationFrame(raf);skillTime=0;skillCooldown=0;revived=false;playing=true;paused=false;last=0;elapsed=0;score=0;hp=heroes[selectedHero].hp;playerY=0;vy=0;items=[];spawn=0;invul=0;document.getElementById('gameMessage').textContent='달려라 '+heroes[selectedHero].name+'! '+heroes[selectedHero].icon;raf=requestAnimationFrame(tick)}
function useSkill(){if(!playing||paused||skillCooldown>0)return;const names=['바삭바삭 돌진','달콤한 딸기비','초코 회오리','푸딩 파티','빛의 질주','황금 바닐라 폭풍'],dur=[3,5,4,5,5,6],cool=[15,20,18,18,15,12];skillTime=dur[selectedHero]||4;skillCooldown=cool[selectedHero]||16;document.getElementById('gameMessage').textContent='✨ '+(names[selectedHero]||heroes[selectedHero].name+'의 달콤한 마법')+' 발동!';if(selectedHero===3)hp=Math.min(heroes[selectedHero].hp,hp+25);if(selectedHero===5)hp=Math.min(heroes[selectedHero].hp,hp+20)}
function jump(){if(!playing||paused)return;if(playerY===0){vy=650;sliding=false}}
function slide(v){sliding=v&&playerY===0}
function togglePause(){if(!playing)return;paused=!paused;document.getElementById('gameMessage').textContent=paused?'⏸️ 일시정지':'달려라!';if(!paused){last=0;raf=requestAnimationFrame(tick)}}
function tick(t){if(!playing||paused)return;if(!last)last=t;let dt=Math.min((t-last)/1000,.035);last=t;elapsed+=dt;skillTime=Math.max(0,skillTime-dt);skillCooldown=Math.max(0,skillCooldown-dt);if(selectedHero===5&&Math.floor((elapsed-dt)/10)!==Math.floor(elapsed/10))hp=Math.min(heroes[selectedHero].hp,hp+20);spawn-=dt;invul=Math.max(0,invul-dt);vy-=1650*dt;playerY=Math.max(0,playerY+vy*dt);if(playerY===0)vy=0;if(spawn<=0){items.push({x:740,type:Math.random()<.7?'jelly':'rock',y:Math.random()<.35?95:0,hit:false});spawn=.65+Math.random()*.5}for(const it of items){it.x-=(260+elapsed*2)*dt;if(!it.hit&&it.x>55&&it.x<155){if(it.type==='jelly'){it.hit=true;score+=skillTime>0&&selectedHero>=4?(selectedHero===5?300:200):100;document.getElementById('gameMessage').textContent='🍬 냠냠! 사탕 획득!';}else if(skillTime>0&&[0,2,4,5].includes(selectedHero)){it.hit=true;if(selectedHero===2)score+=500;}else if((it.y===0?playerY<48:(!sliding||playerY>0))&&invul===0){it.hit=true;hp-=selectedHero===2||selectedHero===3?14:selectedHero===5?10:20;invul=1;document.getElementById('gameMessage').textContent='앗! 장애물! ❤️ -20';}}}items=items.filter(it=>it.x>-40&&!it.hit);if(skillTime>0&&([1,3,4,5].includes(selectedHero)||selectedHero>=6))score+=Math.round(dt*(selectedHero===5?210:90));score+=Math.round(dt*30);document.getElementById('skillButton').textContent=skillCooldown>0?'✨ 스킬 '+Math.ceil(skillCooldown)+'초':'✨ 스킬 사용';if(score>hi){hi=score;localStorage.setItem('dessert-run-best',String(hi))}document.getElementById('scoreboard').textContent='⭐ 점수 '+score+' · ❤️ 체력 '+hp+' · 🏆 최고 '+hi;drawGame();if(hp<=0&&selectedHero===5&&!revived){revived=true;hp=100;invul=2;document.getElementById('gameMessage').textContent='🍦 부활! 체력 100 회복!'}if(hp<=0){playing=false;document.getElementById('gameMessage').textContent='게임 끝! 점수 '+score+'점! 다시 도전해봐 🍩';return}raf=requestAnimationFrame(tick)}
function drawCookie(x,y,duck){ctx.save();ctx.translate(x,y);if(duck)ctx.scale(1,.45);const step=Math.sin(elapsed*19)*12, h=heroes[selectedHero], kind=selectedHero<6?[0,1,2,3,4,4][selectedHero]:Math.floor(selectedHero/30), c=h.color;ctx.lineCap='round';ctx.strokeStyle='#75402c';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-22,16);ctx.lineTo(-31,41+step);ctx.moveTo(22,16);ctx.lineTo(31,41-step);ctx.moveTo(-28,-7);ctx.lineTo(-45,8-step);ctx.moveTo(28,-7);ctx.lineTo(45,8+step);ctx.stroke();ctx.strokeStyle='#94552d';ctx.lineWidth=3;ctx.fillStyle=c;ctx.beginPath();
if(kind===2||kind===7){ctx.arc(0,0,35,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff1d9';ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d9a07a';ctx.stroke();ctx.fillStyle='#f39bc5';ctx.beginPath();ctx.arc(0,0,35,Math.PI,2*Math.PI);ctx.arc(0,0,19,2*Math.PI,Math.PI,true);ctx.closePath();ctx.fill();ctx.fillStyle='#ffe85e';for(let i=0;i<9;i++){let a=i*Math.PI*2/9;ctx.fillRect(Math.cos(a)*26-2,Math.sin(a)*26-2,5,3)}}
else if(kind===1){ctx.moveTo(0,-38);ctx.bezierCurveTo(43,-30,45,9,0,38);ctx.bezierCurveTo(-45,9,-43,-30,0,-38);ctx.fill();ctx.stroke();ctx.fillStyle='#8ad75e';ctx.beginPath();ctx.ellipse(-9,-35,15,7,-.5,0,7);ctx.fill()}
else if(kind===3){ctx.moveTo(-35,-20);ctx.lineTo(35,-20);ctx.lineTo(26,31);ctx.quadraticCurveTo(0,43,-26,31);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#fff1ae';ctx.beginPath();ctx.ellipse(0,-22,36,13,0,0,7);ctx.fill();ctx.stroke()}
else if(kind===4){ctx.moveTo(-25,9);ctx.lineTo(0,44);ctx.lineTo(25,9);ctx.closePath();ctx.fillStyle='#d7a76c';ctx.fill();ctx.stroke();ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,-13,31,Math.PI,Math.PI*2);ctx.lineTo(31,10);ctx.lineTo(-31,10);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,-30,22,Math.PI,Math.PI*2);ctx.fill()}
else if(kind===5){ctx.moveTo(-38,19);ctx.lineTo(-29,-22);ctx.lineTo(29,-22);ctx.lineTo(38,19);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#fff5e0';ctx.beginPath();ctx.arc(0,-23,28,Math.PI,2*Math.PI);ctx.fill();ctx.stroke()}
else if(kind===6){ctx.roundRect(-34,-31,68,63,9);ctx.fill();ctx.stroke();ctx.fillStyle='#f8c59e';ctx.fillRect(-23,-20,46,9)}
else if(kind===8){ctx.ellipse(0,6,37,28,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#f9e5e4';ctx.beginPath();ctx.ellipse(0,-11,33,17,0,0,Math.PI*2);ctx.fill();ctx.stroke()}
else if(kind===9){ctx.moveTo(-35,25);ctx.quadraticCurveTo(-40,-28,0,-34);ctx.quadraticCurveTo(40,-28,35,25);ctx.closePath();ctx.fill();ctx.stroke()}
else{ctx.arc(0,0,36,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#8b4c2c';for(const p of [[-18,-18],[17,-22],[5,20],[-24,12],[25,9]]){ctx.beginPath();ctx.arc(p[0],p[1],5,0,7);ctx.fill()}}
ctx.fillStyle='white';for(const ex of (kind===2||kind===7?[-22,22]:[-12,12])){ctx.beginPath();ctx.arc(ex,kind===4?-12:kind===2||kind===7?-7:0,kind===2||kind===7?5:7,0,7);ctx.fill();ctx.fillStyle='#392820';ctx.beginPath();ctx.arc(ex+2,kind===4?-12:kind===2||kind===7?-7:0,2.5,0,7);ctx.fill();ctx.fillStyle='white'}ctx.strokeStyle='#733c39';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,kind===4?-3:kind===2||kind===7?24:10,kind===2||kind===7?4:7,.15,Math.PI-.15);ctx.stroke();ctx.restore()}
function drawGame(){ctx.clearRect(0,0,720,340);let sky=ctx.createLinearGradient(0,0,0,340);sky.addColorStop(0,'#8bdbff');sky.addColorStop(1,'#fef4c6');ctx.fillStyle=sky;ctx.fillRect(0,0,720,340);ctx.font='55px system-ui';ctx.fillText('☁️',80,95);ctx.fillText('☁️',400,70);ctx.fillText('🏰',590,240);ctx.fillStyle='#9bd66d';ctx.fillRect(0,275,720,65);ctx.fillStyle='#e6ac65';ctx.fillRect(0,285,720,55);ctx.font='44px system-ui';for(const it of items){ctx.fillText(it.type==='jelly'?'🍬':'🪨',it.x,it.y===0?280:223)}if(invul===0||Math.floor(elapsed*12)%2===0){ctx.font=sliding&&playerY===0?'35px system-ui':'65px system-ui';drawCookie(105,(sliding&&playerY===0?250:235-playerY),sliding&&playerY===0)}if(skillTime>0){ctx.strokeStyle='#b96aff';ctx.lineWidth=6;ctx.beginPath();ctx.arc(105,235-playerY,49,0,Math.PI*2);ctx.stroke();ctx.font='23px system-ui';ctx.fillText('✨ 스킬 발동!',280,45)}ctx.font='21px system-ui';ctx.fillStyle='#623a2a';ctx.fillText('달콤한 쿠키마을 1-1',18,30)}
cv.addEventListener('pointerdown',e=>{if(e.target===cv)jump()});window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){if(document.activeElement.tagName!=='INPUT'){e.preventDefault();jump()}}if(e.code==='ArrowDown'){e.preventDefault();slide(true)}});window.addEventListener('keyup',e=>{if(e.code==='ArrowDown')slide(false)});initHeroes();drawGame();
