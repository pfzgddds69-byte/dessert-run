<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디저트런 공식 홈페이지</title><style>body{margin:0;font-family:system-ui;background:#fff1d9;color:#613923;text-align:center}header{background:#ffbd78;padding:30px}h1{font-size:42px}button,input{font:inherit;border:2px solid #e7a36b;border-radius:12px;padding:10px;background:white;color:#683a24;cursor:pointer}nav{padding:15px}main{max-width:1000px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:white;border-radius:16px;padding:10px;border:2px solid #efc89c}.face{font-size:65px}.detail{position:fixed;inset:0;background:#3325;display:grid;place-items:center}.panel{background:#fffaf0;border-radius:20px;padding:25px;width:min(350px,85vw)}.hide{display:none}.pages{padding:20px}button:focus{outline:3px solid orange}</style><header><h1>🍰 디저트런 🍪</h1><p>디저트 왕국 공식 홈페이지 · 베타</p></header><nav><button onclick="show('home')">🏠 홈</button> <button onclick="show('dex')">📖 도감</button> <button onclick="show('game')">🎮 게임</button></nav><main><section id="home"><h2>달콤한 모험에 오신 걸 환영해요!</h2><p>300종 디저트 친구를 만나보세요.</p><button onclick="show('dex')">도감 열기 →</button></section><section id="dex" class="hide"><h2>🍪 디저트 도감 300종</h2><p id="counter"></p><input id="search" placeholder="캐릭터 검색" oninput="draw(1)"><div id="grid" class="grid"></div><div id="pages" class="pages"></div></section><section id="game" class="hide"><h2>🎮 달콤한 쿠키마을 1-1</h2><p>게임은 다음 업데이트에서 만나요!</p></section></main><div id="detail" class="detail hide"><div class="panel"><button onclick="closeDetail()">✕ 닫기</button><div id="info"></div></div></div><script>const cats=['쿠키','젤리','도넛','푸딩','아이스크림','케이크','초콜릿','마카롱','떡','디저트'],icons=['🍪','🍓','🍩','🍮','🍦','🍰','🍫','🧁','🍡','🥐'],flavors=['바삭','딸기','초코칩','바닐라','꿀','민트','블루베리','레몬','카라멜','체리','우유','코코넛','복숭아','망고','라즈베리','솜사탕','호두','아몬드','황금','무지개','별빛','달빛','하트','구름','눈꽃','호박','시나몬','말차','크림','왕관'];const names=['바삭쿠키','딸기젤리','초코도넛','푸딩','바닐라크림','바닐라 아이스크림'];const all=Array.from({length:300},(_,i)=>({id:i+1,name:names[i]||flavors[i%30]+cats[Math.floor(i/30)],icon:icons[Math.floor(i/30)],hp:100+i%12*10}));let owned;try{owned=JSON.parse(localStorage.getItem('dessert-run-owned')||'[1]')}catch(e){owned=[1]}function show(id){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hide',s.id!==id));if(id==='dex')draw(1)}function draw(page){let q=document.getElementById('search').value;let a=all.filter(c=>c.name.includes(q));document.getElementById('counter').textContent='수집 '+owned.length+'/300 · 검색 결과 '+a.length+'종';document.getElementById('grid').innerHTML=a.slice((page-1)*30,page*30).map(c=>'<button class="card" onclick="openDetail('+c.id+')"><div class="face">'+c.icon+'</div><small>No.'+c.id+'</small><h4>'+c.name+'</h4><small>'+(owned.includes(c.id)?'✅ 수집':'🔒 미수집')+'</small></button>').join('');document.getElementById('pages').innerHTML=Array.from({length:Math.ceil(a.length/30)},(_,i)=>'<button onclick="draw('+(i+1)+')">'+(i+1)+'</button>').join('')}function openDetail(id){let c=all[id-1];document.getElementById('info').innerHTML='<div class="face">'+c.icon+'</div><h2>'+c.name+'</h2><p>❤️ 체력 '+c.hp+'</p><p>✨ 달콤한 마법</p><button onclick="claim('+id+')">'+(owned.includes(id)?'✓ 수집 완료':'🎁 VIP 무료 획득')+'</button>';document.getElementById('detail').classList.remove('hide')}function closeDetail(){document.getElementById('detail').classList.add('hide')}function claim(id){if(!owned.includes(id)){owned.push(id);localStorage.setItem('dessert-run-owned',JSON.stringify(owned))}openDetail(id);draw(1)}</script></html>
