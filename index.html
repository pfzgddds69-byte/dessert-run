<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디저트런 공식 홈페이지</title><style>body{margin:0;font-family:system-ui;background:#fff1d9;color:#613923;text-align:center}header{background:#ffbd78;padding:30px}h1{font-size:42px}button,input{font:inherit;border:2px solid #e7a36b;border-radius:12px;padding:10px;background:white;color:#683a24;cursor:pointer}nav{padding:15px}main{max-width:1000px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:white;border-radius:16px;padding:10px;border:2px solid #efc89c}.face{font-size:65px}.detail{position:fixed;inset:0;background:#3325;display:grid;place-items:center}.panel{background:#fffaf0;border-radius:20px;padding:25px;width:min(350px,85vw)}.hide{display:none}.pages{padding:20px}button:focus{outline:3px solid orange}</style><header><h1>🍰 디저트런 🍪</h1><p>디저트 왕국 공식 홈페이지 · 베타</p></header><nav><button onclick="show('home')">🏠 홈</button> <button onclick="show('dex')">📖 도감</button> <button onclick="show('game')">🎮 게임</button></nav><main><section id="home"><h2>달콤한 모험에 오신 걸 환영해요!</h2><p>300종 디저트 친구를 만나보세요.</p><button onclick="show('dex')">도감 열기 →</button></section><section id="dex" class="hide"><h2>🍪 디저트 도감 300종</h2><p id="counter"></p><input id="search" placeholder="캐릭터 검색" oninput="draw(1)"><div id="grid" class="grid"></div><div id="pages" class="pages"></div></section><section id="game" class="hide"><h2>🎮 달콤한 쿠키마을 1-1</h2><p>🍪 바삭쿠키와 함께 달리고 젤리를 모아봐!</p><div id="scoreboard">점수 0 · 체력 100 · 최고 0</div><canvas id="runner" width="720" height="340" style="width:100%;max-width:720px;background:#bceeff;border:5px solid #e7a36b;border-radius:18px;touch-action:none"></canvas><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px"><button onclick="startGame()">▶️ 시작 / 다시하기</button><button onpointerdown="jump()" style="background:#ffe0a8">⬆️ 점프</button><button onpointerdown="slide(true)" onpointerup="slide(false)" onpointercancel="slide(false)" style="background:#ffe0a8">⬇️ 슬라이드</button><button onclick="togglePause()">⏸️ 일시정지</button></div><p>아이패드: 점프 버튼 또는 게임 화면 터치 · 키보드: 스페이스 점프, ↓ 슬라이드</p><p id="gameMessage">시작 버튼을 눌러 모험을 시작해!</p></section></main><div id="detail" class="detail hide"><div class="panel"><button onclick="closeDetail()">✕ 닫기</button><div id="info"></div></div></div><script>const cats=['쿠키','젤리','도넛','푸딩','아이스크림','케이크','초콜릿','마카롱','떡','디저트'],icons=['🍪','🍓','🍩','🍮','🍦','🍰','🍫','🧁','🍡','🥐'],flavors=['바삭','딸기','초코칩','바닐라','꿀','민트','블루베리','레몬','카라멜','체리','우유','코코넛','복숭아','망고','라즈베리','솜사탕','호두','아몬드','황금','무지개','별빛','달빛','하트','구름','눈꽃','호박','시나몬','말차','크림','왕관'];const names=['바삭쿠키','딸기젤리','초코도넛','푸딩','바닐라크림','바닐라 아이스크림'];const all=Array.from({length:300},(_,i)=>({id:i+1,name:names[i]||flavors[i%30]+cats[Math.floor(i/30)],icon:icons[Math.floor(i/30)],hp:100+i%12*10}));let owned;try{owned=JSON.parse(localStorage.getItem('dessert-run-owned')||'[1]')}catch(e){owned=[1]}function show(id){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hide',s.id!==id));if(id==='dex')draw(1)}function draw(page){let q=document.getElementById('search').value;let a=all.filter(c=>c.name.includes(q));document.getElementById('counter').textContent='수집 '+owned.length+'/300 · 검색 결과 '+a.length+'종';document.getElementById('grid').innerHTML=a.slice((page-1)*30,page*30).map(c=>'<button class="card" onclick="openDetail('+c.id+')"><div class="face">'+c.icon+'</div><small>No.'+c.id+'</small><h4>'+c.name+'</h4><small>'+(owned.includes(c.id)?'✅ 수집':'🔒 미수집')+'</small></button>').join('');document.getElementById('pages').innerHTML=Array.from({length:Math.ceil(a.length/30)},(_,i)=>'<button onclick="draw('+(i+1)+')">'+(i+1)+'</button>').join('')}function openDetail(id){let c=all[id-1];document.getElementById('info').innerHTML='<div class="face">'+c.icon+'</div><h2>'+c.name+'</h2><p>❤️ 체력 '+c.hp+'</p><p>✨ 달콤한 마법</p><button onclick="claim('+id+')">'+(owned.includes(id)?'✓ 수집 완료':'🎁 VIP 무료 획득')+'</button>';document.getElementById('detail').classList.remove('hide')}function closeDetail(){document.getElementById('detail').classList.add('hide')}function claim(id){if(!owned.includes(id)){owned.push(id);localStorage.setItem('dessert-run-owned',JSON.stringify(owned))}openDetail(id);draw(1)}
const cv=document.getElementById('runner'),ctx=cv.getContext('2d');let playing=false,paused=false,raf=0,last=0,elapsed=0,score=0,hp=100,hi=Number(localStorage.getItem('dessert-run-best')||0),playerY=0,vy=0,sliding=false,items=[],spawn=0,invul=0;
function startGame(){cancelAnimationFrame(raf);playing=true;paused=false;last=0;elapsed=0;score=0;hp=100;playerY=0;vy=0;items=[];spawn=0;invul=0;document.getElementById('gameMessage').textContent='달려라 바삭쿠키! 🍪';raf=requestAnimationFrame(tick)}
function jump(){if(!playing||paused)return;if(playerY===0){vy=650;sliding=false}}
function slide(v){sliding=v&&playerY===0}
function togglePause(){if(!playing)return;paused=!paused;document.getElementById('gameMessage').textContent=paused?'⏸️ 일시정지':'달려라!';if(!paused){last=0;raf=requestAnimationFrame(tick)}}
function tick(t){if(!playing||paused)return;if(!last)last=t;let dt=Math.min((t-last)/1000,.035);last=t;elapsed+=dt;spawn-=dt;invul=Math.max(0,invul-dt);vy-=1650*dt;playerY=Math.max(0,playerY+vy*dt);if(playerY===0)vy=0;if(spawn<=0){items.push({x:740,type:Math.random()<.7?'jelly':'rock',y:Math.random()<.35?95:0,hit:false});spawn=.65+Math.random()*.5}for(const it of items){it.x-=(260+elapsed*2)*dt;if(!it.hit&&it.x>70&&it.x<137){let collide=it.y===0?playerY<48:playerY>45&&playerY<135;if(collide){it.hit=true;if(it.type==='jelly'){score+=100}else if(invul===0){hp-=20;invul=1;document.getElementById('gameMessage').textContent='앗! 장애물! ❤️ -20'}}}}items=items.filter(it=>it.x>-40);score+=Math.round(dt*30);if(score>hi){hi=score;localStorage.setItem('dessert-run-best',String(hi))}document.getElementById('scoreboard').textContent='⭐ 점수 '+score+' · ❤️ 체력 '+hp+' · 🏆 최고 '+hi;drawGame();if(hp<=0){playing=false;document.getElementById('gameMessage').textContent='게임 끝! 점수 '+score+'점! 다시 도전해봐 🍩';return}raf=requestAnimationFrame(tick)}
function drawGame(){ctx.clearRect(0,0,720,340);let sky=ctx.createLinearGradient(0,0,0,340);sky.addColorStop(0,'#8bdbff');sky.addColorStop(1,'#fef4c6');ctx.fillStyle=sky;ctx.fillRect(0,0,720,340);ctx.font='55px system-ui';ctx.fillText('☁️',80,95);ctx.fillText('☁️',400,70);ctx.fillText('🏰',590,240);ctx.fillStyle='#9bd66d';ctx.fillRect(0,275,720,65);ctx.fillStyle='#e6ac65';ctx.fillRect(0,285,720,55);ctx.font='44px system-ui';for(const it of items){ctx.fillText(it.type==='jelly'?'🍬':'🪨',it.x,it.y===0?280:175)}if(invul===0||Math.floor(elapsed*12)%2===0){ctx.font=sliding&&playerY===0?'35px system-ui':'65px system-ui';ctx.fillText('🍪',75,275-playerY)}ctx.font='21px system-ui';ctx.fillStyle='#623a2a';ctx.fillText('달콤한 쿠키마을 1-1',18,30)}
cv.addEventListener('pointerdown',e=>{if(e.target===cv)jump()});window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){if(document.activeElement.tagName!=='INPUT'){e.preventDefault();jump()}}if(e.code==='ArrowDown'){e.preventDefault();slide(true)}});window.addEventListener('keyup',e=>{if(e.code==='ArrowDown')slide(false)});drawGame();
</script></html>
